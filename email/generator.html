<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Generator</title>
<style>
  :root { --bg:#0b0a10; --panel:#131019; --line:#2a2536; --text:#f7f3ec; --muted:#a79f95; --green:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px; display:grid; grid-template-columns:320px 1fr; gap:20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; align-self:start; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px; }
  input { width:100%; padding:11px 12px; margin-bottom:16px; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:15px; }
  input:focus { outline:2px solid var(--green); border-color:transparent; }
  button { width:100%; padding:12px; margin-top:8px; border:0; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; }
  .primary { background:linear-gradient(135deg,#86efac,#22c55e); color:#0b0a10; }
  .ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .subject { margin-top:16px; padding:10px 12px; background:var(--bg); border:1px dashed var(--line); border-radius:8px; font-size:13px; color:var(--muted); word-break:break-word; }
  iframe { width:100%; height:calc(100vh - 48px); min-height:600px; border:1px solid var(--line); border-radius:14px; background:#fff; }
  #status { min-height:18px; margin-top:12px; font-size:13px; color:var(--green); }
  @media (max-width:800px) { .wrap { grid-template-columns:1fr; } iframe { height:700px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <label for="biz">Business name</label>
    <input id="biz" placeholder="Sunrise Bakery" autocomplete="off">
    <label for="me">Your name</label>
    <input id="me" placeholder="Your name" autocomplete="off">
    <button class="primary" id="copyEmail">Copy email</button>
    <button class="ghost" id="copyHtml">Copy HTML</button>
    <button class="ghost" id="copySubject">Copy subject</button>
    <div class="subject" id="subject"></div>
    <div id="status" role="status"></div>
  </div>
  <iframe id="preview" title="Email preview"></iframe>
</div>
<script type="text/template" id="tpl">

<script>
  const tpl = document.getElementById('tpl').textContent;
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('gen') || '{}'); } catch (e) {}
  $('biz').value = saved.biz || '';
  $('me').value = saved.me || '';

  function build() {
    const biz = $('biz').value.trim() || 'Your Business';
    const me = $('me').value.trim() || 'Your Name';
    return tpl
      .split('%20{{business_name}}').join('%20' + encodeURIComponent(biz))
      .split('{{business_name}}').join(esc(biz))
      .split('{{your_name}}').join(esc(me));
  }
  function subject() { return 'A website for ' + ($('biz').value.trim() || 'Your Business'); }
  function render() {
    $('preview').srcdoc = build();
    $('subject').textContent = 'Subject: ' + subject();
    try { localStorage.setItem('gen', JSON.stringify({ biz: $('biz').value, me: $('me').value })); } catch (e) {}
  }
  function say(m) { $('status').textContent = m; setTimeout(() => $('status').textContent = '', 2500); }

  $('biz').addEventListener('input', render);
  $('me').addEventListener('input', render);

  $('copyEmail').onclick = async () => {
    const html = build();
    try {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([html], { type: 'text/plain' })
      })]);
      say('Copied. Paste into your email.');
    } catch (e) {
      const d = $('preview').contentDocument;
      d.designMode = 'on'; d.body.focus(); d.execCommand('selectAll');
      say(d.execCommand('copy') ? 'Copied. Paste into your email.' : 'Copy failed.');
      d.designMode = 'off'; getSelection().removeAllRanges();
    }
  };
  $('copyHtml').onclick = async () => { await navigator.clipboard.writeText(build()); say('HTML copied.'); };
  $('copySubject').onclick = async () => { await navigator.clipboard.writeText(subject()); say('Subject copied.'); };
  render();
</script>
