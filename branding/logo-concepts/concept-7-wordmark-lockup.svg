  </defs>

  <!-- Icon: 11:11 bars mark -->
  <rect x="20" y="20" width="180" height="180" rx="40" fill="#0b0a10" />
  <rect x="56" y="70" width="14" height="80" rx="7" fill="url(#g)" />
  <rect x="76" y="70" width="14" height="80" rx="7" fill="url(#g)" />
  <circle cx="110" cy="90" r="6" fill="url(#gold)" />
  <circle cx="110" cy="130" r="6" fill="url(#gold)" />
  <rect x="130" y="70" width="14" height="80" rx="7" fill="url(#g)" />
  <rect x="150" y="70" width="14" height="80" rx="7" fill="url(#g)" />

  <!-- Wordmark -->
  <text x="240" y="130" font-weight="800" font-size="64" letter-spacing="0.5" fill="url(#g)">ELEVVEN11</text>
  <text x="242" y="180" font-weight="700" font-size="34" letter-spacing="6" fill="#a79f95">STUDIO</text>
