<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Outfit', 'Segoe UI', sans-serif; }
    </style>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="champagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c866" />
      <stop offset="100%" stop-color="#c99a2e" />
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="#0b0a10" />
  <rect width="1080" height="1080" fill="url(#glow1)" />

  <text x="540" y="200" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="6" fill="#86efac">REFERRAL PROGRAM</text>

  <text x="540" y="310" text-anchor="middle" font-size="60" font-weight="800" fill="#f7f3ec">Know someone who</text>
  <text x="540" y="380" text-anchor="middle" font-size="60" font-weight="800" fill="#f7f3ec">needs a website?</text>

  <!-- Big earn number - gold, since this is money the agent earns, not the site's core green brand action -->
  <text x="540" y="590" text-anchor="middle" font-size="150" font-weight="800" fill="url(#champagne)">₦10,000</text>
  <text x="540" y="650" text-anchor="middle" font-size="32" fill="#a79f95">commission per Starter website you refer</text>

  <!-- Steps -->
  <g font-size="28" fill="#f7f3ec">
    <circle cx="290" cy="770" r="28" fill="none" stroke="#86efac" stroke-width="2" />
    <text x="290" y="780" text-anchor="middle" font-weight="800" fill="#86efac">1</text>
    <text x="290" y="835" text-anchor="middle" font-size="24">Refer</text>

    <circle cx="540" cy="770" r="28" fill="none" stroke="#86efac" stroke-width="2" />
    <text x="540" y="780" text-anchor="middle" font-weight="800" fill="#86efac">2</text>
    <text x="540" y="835" text-anchor="middle" font-size="24">They Order</text>

    <circle cx="790" cy="770" r="28" fill="none" stroke="#86efac" stroke-width="2" />
    <text x="790" y="780" text-anchor="middle" font-weight="800" fill="#86efac">3</text>
    <text x="790" y="835" text-anchor="middle" font-size="24">You Get Paid</text>
  </g>

  <rect x="340" y="895" width="400" height="86" rx="43" fill="url(#neon)" />
  <text x="540" y="948" text-anchor="middle" font-size="32" font-weight="700" fill="#0b0a10">Become an Agent</text>

  <line x1="140" y1="1005" x2="940" y2="1005" stroke="#f7f3ec" stroke-opacity="0.12" stroke-width="2" />
  <text x="540" y="1050" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="1" fill="url(#neon)">ELEVVEN11 STUDIO</text>
</svg>
