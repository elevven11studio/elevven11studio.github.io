<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Outfit', 'Segoe UI', sans-serif; }
    </style>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0b0a10" />
  <rect width="1080" height="1080" fill="url(#glow1)" />
  <rect width="1080" height="1080" fill="url(#glow2)" />

  <!-- Eyebrow -->
  <text x="540" y="300" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="3" fill="#86efac">WEBSITES FOR EVERYDAY PEOPLE</text>
  <text x="540" y="336" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="3" fill="#86efac">&amp; SMALL BUSINESSES</text>

  <!-- Headline -->
  <text x="540" y="450" text-anchor="middle" font-size="84" font-weight="800" fill="#f7f3ec">Simple Websites.</text>
  <text x="540" y="545" text-anchor="middle" font-size="84" font-weight="800" fill="url(#neon)">No Monthly</text>
  <text x="540" y="640" text-anchor="middle" font-size="84" font-weight="800" fill="url(#neon)">Hosting Fee.</text>

  <!-- Subtext -->
  <text x="540" y="730" text-anchor="middle" font-size="34" fill="#a79f95">Starting at ₦50,000 &#183; One-time payment</text>

  <!-- Price pill -->
  <rect x="390" y="790" width="300" height="86" rx="43" fill="url(#neon)" />
  <text x="540" y="843" text-anchor="middle" font-size="34" font-weight="700" fill="#0b0a10">Get Your Website</text>

  <!-- Footer -->
  <line x1="140" y1="960" x2="940" y2="960" stroke="#f7f3ec" stroke-opacity="0.12" stroke-width="2" />
  <text x="540" y="1015" text-anchor="middle" font-size="32" font-weight="800" letter-spacing="1" fill="url(#neon)">ELEVVEN11 STUDIO</text>
</svg>
