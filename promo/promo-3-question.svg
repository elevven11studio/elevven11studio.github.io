<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'Outfit', 'Segoe UI', sans-serif; }
    </style>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="#0b0a10" />
  <rect width="1080" height="1080" fill="url(#glow1)" />

  <text x="540" y="230" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="6" fill="#86efac">A QUICK QUESTION</text>

  <text x="540" y="340" text-anchor="middle" font-size="66" font-weight="800" fill="#f7f3ec">Do you really need</text>
  <text x="540" y="415" text-anchor="middle" font-size="66" font-weight="800" fill="url(#neon)">a website?</text>

  <!-- Quote card -->
  <rect x="140" y="500" width="800" height="260" rx="18" fill="#131019" stroke="#f7f3ec" stroke-opacity="0.1" />
  <text x="540" y="580" text-anchor="middle" font-size="34" font-style="italic" fill="#a79f95">"Where can I see your</text>
  <text x="540" y="625" text-anchor="middle" font-size="34" font-style="italic" fill="#a79f95">services or your work?"</text>
  <text x="540" y="700" text-anchor="middle" font-size="26" fill="#7a7268">— if customers keep asking this...</text>

  <text x="540" y="850" text-anchor="middle" font-size="42" font-weight="700" fill="#f7f3ec">A simple website might be</text>
  <text x="540" y="905" text-anchor="middle" font-size="42" font-weight="700" fill="#f7f3ec">all you need.</text>

  <line x1="140" y1="985" x2="940" y2="985" stroke="#f7f3ec" stroke-opacity="0.12" stroke-width="2" />
  <text x="540" y="1035" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="1" fill="url(#neon)">ELEVVEN11 STUDIO</text>
</svg>
