# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # A normal deploy takes about a minute. Fail fast if a step hangs.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The repo holds more than the website: social/promo exports and the
      # Node scripts that generate them. Publishing those shipped ~34 MB of
      # files no page ever requests. Stage only what the site actually serves.
      #
      # Anything excluded here must be genuinely unreferenced - check with a
      # grep for the path across *.html/*.css/*.js FIRST, and remember OG tags
      # reference images by absolute URL (https://elevven11studio.github.io/...),
      # not just by rooted path. assets/slides/ as a whole is NOT excludable:
      # the numbered subfolders (agents/, contact/, faq/, how-it-works/) are
      # live slider images. Only the unused exports beside them go.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'scripts' \
            --exclude 'promo' \
            --exclude 'assets/slides/singles' \
            --exclude 'assets/slides/*-all.png'
          echo "repo:      $(du -sh --exclude=.git --exclude=_site . | cut -f1)"
          echo "published: $(du -sh _site | cut -f1)"

      # Minify the two shared assets in the staged copy only. The repo keeps
      # readable source, so there is nothing to rebuild or forget to commit.
      - name: Minify CSS and JS
        run: |
          npx --yes esbuild@0.28 _site/assets/style.css --minify --allow-overwrite --outfile=_site/assets/style.css
          npx --yes esbuild@0.28 _site/assets/main.js --minify --allow-overwrite --outfile=_site/assets/main.js
          ls -l _site/assets/style.css _site/assets/main.js

      # Same for the Tools section: shared files first, then the per-tool
      # scripts, each written back to its own folder.
      - name: Minify tools CSS and JS
        run: |
          npx --yes esbuild@0.28 _site/tools/assets/tools.css _site/tools/assets/shared.js _site/tools/assets/calc.js _site/tools/assets/qr.js _site/tools/assets/landing.js --minify --allow-overwrite --outdir=_site/tools/assets
          npx --yes esbuild@0.28 _site/tools/assets/t/*.js --minify --allow-overwrite --outdir=_site/tools/assets/t
          ls -l _site/tools/assets _site/tools/assets/t

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
